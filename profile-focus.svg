<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E14"/>
      <stop offset="55%" stop-color="#0D1220"/>
      <stop offset="100%" stop-color="#0A0E14"/>
    </linearGradient>

    <pattern id="dotGrid2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1B2433"/>
    </pattern>

    <clipPath id="panelClip2">
      <rect x="0" y="0" width="1200" height="260" rx="14"/>
    </clipPath>

    <!-- card icons -->
    <g id="iconML">
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="30" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="30" cy="26" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="15.5" y1="11" x2="26.5" y2="8.8" stroke="currentColor" stroke-width="2"/>
      <line x1="15.5" y1="13.5" x2="26.5" y2="24" stroke="currentColor" stroke-width="2"/>
    </g>

    <g id="iconStack">
      <rect x="4" y="4" width="28" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="4" y="16" width="28" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="4" y="28" width="28" height="4" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>

    <g id="iconChain">
      <rect x="3" y="10" width="14" height="14" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="19" y="10" width="14" height="14" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>

    <g id="iconArch">
      <rect x="4" y="20" width="8" height="10" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="14" y="12" width="8" height="18" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="24" y="4" width="8" height="26" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>
  </defs>

  <g clip-path="url(#panelClip2)">
    <rect x="0" y="0" width="1200" height="260" fill="url(#bgGrad2)"/>
    <rect x="0" y="0" width="1200" height="260" fill="url(#dotGrid2)"/>
    <rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="none" stroke="#1C2431" stroke-width="1"/>
  </g>

  <g font-family="JetBrains Mono, Consolas, monospace">
    <text x="48" y="42" font-size="15" fill="#A78BFA">$</text>
    <text x="66" y="42" font-size="15" fill="#C9D3DE">cat engineering_focus.md</text>
  </g>

  <!-- card 1: AI & ML -->
  <g transform="translate(48,72)" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.05;0.35" dur="1.6s" begin="0s" fill="freeze"/>
    <rect width="258" height="150" rx="12" fill="#10151D" stroke="#1F2A3A" stroke-width="1"/>
    <rect x="0" y="0" width="258" height="4" rx="2" fill="#5EEAD4"/>
    <use href="#iconML" x="24" y="26" width="36" height="36" color="#5EEAD4"/>
    <text x="24" y="90" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6EDF3">AI &amp; ML</text>
    <text x="24" y="114" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#8A95A3">Model training,</text>
    <text x="24" y="130" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#8A95A3">predictive analytics</text>
  </g>

  <!-- card 2: Full-Stack Dev -->
  <g transform="translate(330,72)" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.12;0.42" dur="1.6s" begin="0.15s" fill="freeze"/>
    <rect width="258" height="150" rx="12" fill="#10151D" stroke="#1F2A3A" stroke-width="1"/>
    <rect x="0" y="0" width="258" height="4" rx="2" fill="#7DD3FC"/>
    <use href="#iconStack" x="24" y="26" width="36" height="36" color="#7DD3FC"/>
    <text x="24" y="90" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6EDF3">Full-Stack Dev</text>
    <text x="24" y="114" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#8A95A3">MERN, Next.js,</text>
    <text x="24" y="130" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#8A95A3">REST APIs</text>
  </g>

  <!-- card 3: Blockchain & Web3 -->
  <g transform="translate(612,72)" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.19;0.49" dur="1.6s" begin="0.3s" fill="freeze"/>
    <rect width="258" height="150" rx="12" fill="#10151D" stroke="#1F2A3A" stroke-width="1"/>
    <rect x="0" y="0" width="258" height="4" rx="2" fill="#A78BFA"/>
    <use href="#iconChain" x="24" y="26" width="36" height="36" color="#A78BFA"/>
    <text x="24" y="90" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6EDF3">Blockchain &amp; Web3</text>
    <text x="24" y="114" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#8A95A3">Smart contracts,</text>
    <text x="24" y="130" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#8A95A3">decentralized systems</text>
  </g>

  <!-- card 4: System Design -->
  <g transform="translate(894,72)" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.26;0.56" dur="1.6s" begin="0.45s" fill="freeze"/>
    <rect width="258" height="150" rx="12" fill="#10151D" stroke="#1F2A3A" stroke-width="1"/>
    <rect x="0" y="0" width="258" height="4" rx="2" fill="#F0B429"/>
    <use href="#iconArch" x="24" y="26" width="36" height="36" color="#F0B429"/>
    <text x="24" y="90" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6EDF3">System Design</text>
    <text x="24" y="114" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#8A95A3">Scalable architecture,</text>
    <text x="24" y="130" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#8A95A3">database design</text>
  </g>
</svg>
